spring.application.name=autoloc-api

# Connexion à la base de données
spring.datasource.url=jdbc:mariadb://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
# Le mot de passe est dans application-local.properties (ignoré par git) ou la variable DB_PASSWORD
spring.config.import=optional:classpath:application-local.properties
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Journaux
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO

server.port=8081

server.servlet.context-path=/api